name: Archive Douban

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Archive Douban records
        env:
          DOUBAN_COOKIE: ${{ secrets.DOUBAN_COOKIE }}
          DOUBAN_USER: ${{ secrets.DOUBAN_USER }}
        run: python scripts/archive_douban.py

      - name: Commit archive updates
        run: |
          if git diff --quiet -- data/douban.json; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/douban.json
          git commit -m "Update Douban archive"
          git push
